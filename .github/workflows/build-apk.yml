name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Web Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Production Web Assets
      run: npm run build --if-present
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Initialize Capacitor Android Container
      run: npx cap sync android || true

    - name: Install Asset Tools
      run: npm install @capacitor/assets --save-dev --legacy-peer-deps

    - name: Generate Adaptive Android Icons
      run: npx @capacitor/assets generate --android # 👈 Reads your explicit multi-layer assets from the folder

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Ensure Debug Keystore Exists
      run: |
        mkdir -p android/app
        if [ ! -f android/app/debug.keystore ]; then
          keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Enable AndroidX Flags Automatically
      run: |
        cd android
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

    - name: Grant Execute Permission to Gradle
      run: chmod +x android/gradlew

    - name: Build Android Debug APK
      run: |
        cd android
        ./gradlew assembleDebug -PappVersionCode=${{ github.run_number }} -PappVersionName="1.0.${{ github.run_number }}"

    - name: Upload Installable APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Vidyalayam-APK
        path: android/app/build/outputs/apk/debug/*.apk

    - name: Create or Update GitHub Release (Latest)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Vidyalayam v1.0.${{ github.run_number }} (Latest)"
        body: |
          ### 🚀 Vidyalayam Latest Android Release
          - **Build**: #${{ github.run_number }}
          - **Commit**: `${{ github.sha }}`
          - Automatically compiled and released via GitHub Actions.
          - Download the `.apk` file below to install directly on Android.
        draft: false
        prerelease: false
        make_latest: true
        files: |
          android/app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

