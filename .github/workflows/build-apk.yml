name: Build Native Android APK & Release Latest

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Web Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Production Web Assets
      run: npm run build

    - name: Initialize Capacitor Android Container
      run: npx cap sync android || true

    - name: Install Asset Tools
      run: npm install @capacitor/assets --save-dev --legacy-peer-deps || true

    - name: Generate Adaptive Android Icons
      run: npx @capacitor/assets generate --android || true

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Enable AndroidX Flags Automatically
      run: |
        cd android
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

    - name: Grant Execute Permission to Gradle
      run: chmod +x android/gradlew

    - name: Build Android Debug APK
      run: |
        cd android
        ./gradlew assembleDebug -PappVersionCode=${{ github.run_number }} -PappVersionName="1.0.${{ github.run_number }}"

    - name: Organize APK Output Artifacts
      run: |
        mkdir -p build-outputs
        cp android/app/build/outputs/apk/debug/app-debug.apk build-outputs/Vidyalayam-Latest.apk
        cp android/app/build/outputs/apk/debug/app-debug.apk "build-outputs/Vidyalayam-v1.0.${{ github.run_number }}.apk"

    - name: Upload Installable APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Vidyalayam-Latest-APK
        path: build-outputs/*.apk

    - name: Update 'latest' Git Tag
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -f latest
        git push -f origin latest || true

    - name: Publish Automated GitHub Release (Latest)
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Vidyalayam App — Latest Build (v1.0.${{ github.run_number }})"
        draft: false
        prerelease: false
        make_latest: true
        body: |
          # 🏫 વિદ્યાલયમ્ (Vidyalayam) — Latest Native Android Build
          
          [![Release](https://img.shields.io/badge/Release-Latest-00b894?style=for-the-badge&logo=android)](../../releases/latest)
          [![Build Status](https://img.shields.io/badge/Build-Passing-brightgreen?style=for-the-badge&logo=githubactions)](../../actions)

          ### 🚀 Automated Build Details
          - **Build Run:** `#${{ github.run_number }}`
          - **Version:** `1.0.${{ github.run_number }}`
          - **Commit Ref:** `${{ github.sha }}`
          - **Timestamp:** ${{ github.event.head_commit.timestamp || 'Latest' }}

          ---

          ### 📲 Direct APK Downloads:
          Click either link below to immediately download and install on Android:
          - 🟢 **[Download Vidyalayam-Latest.apk](../../releases/download/latest/Vidyalayam-Latest.apk)** *(Always points to the newest build)*
          - 📦 **[Download Vidyalayam-v1.0.${{ github.run_number }}.apk](../../releases/download/latest/Vidyalayam-v1.0.${{ github.run_number }}.apk)** *(Versioned archive)*

          ---

          ### 🌟 Key Included Features:
          - 📊 **એકમ કસોટી (PAT) & સત્રાંત પરીક્ષા (Term Exam)**: Automated Marksheets, Ranking, & Statistics
          - 🪪 **Student & Staff Management**: ID Card Printing, L.C. (Leaving Certificate), Bonafide generator
          - 🎙️ **દૈનિક પ્રાર્થના સભા**: સુવિચાર, જાણવા જેવું, પ્રશ્નોત્તરી, સમાચાર, & Gujarati Voice Narration
          - 💬 **WhatsApp & SMS Dispatcher**: One-tap exam marks delivery directly to parents
          - ☁️ **Cloud Realtime Sync**: Firebase Firestore integration for high reliability

          ---

          ### 📞 Admin & Technical Contact
          **NR Chad**  
          📱 Mobile: **[+91 7203070830](tel:+917203070830)**  
          💬 WhatsApp: **[Chat on WhatsApp](https://wa.me/917203070830?text=Hello%20NR%20Chad,%20inquiry%20regarding%20Vidyalayam%20App)**
        files: |
          build-outputs/Vidyalayam-Latest.apk
          build-outputs/Vidyalayam-v1.0.${{ github.run_number }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

