name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Required to grant GitHub Actions permission to create a release and upload assets
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Web Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Production Web Assets
      run: npm run build --if-present

    - name: Initialize Capacitor Android Container
      run: npx cap sync android || true

    - name: Install Asset Tools
      run: npm install @capacitor/assets --save-dev --legacy-peer-deps

    - name: Generate Material You Adaptive Icons
      run: npx @capacitor/assets generate --android

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Enable AndroidX Flags Automatically
      run: |
        cd android
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

    # 💡 This new step automatically generates the missing debug.keystore file required by your project layout
    - name: Auto-Generate Missing Debug Keystore
      run: |
        cd android/app
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        echo "Successfully generated key template wrapper!"

    - name: Grant Execute Permission to Gradle
      run: chmod +x android/gradlew

    - name: Build Android Debug APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload Installable APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Vidyalayam-APK
        path: android/app/build/outputs/apk/debug/*.apk

    # 🚀 Automatically creates/updates a release on every push to main
    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' # Only runs on the main branch push (ignores Pull Requests)
      with:
        tag_name: latest
        name: Latest Automated Build
        body: |
          Automated development build compiled straight from the `main` branch.
          **Last updated:** ${{ github.event.head_commit.timestamp }}
        files: android/app/build/outputs/apk/debug/*.apk
        prerelease: true # Marks it as a pre-release since it's a rolling build
        overwrite: true  # Replaces the older APK file with the newest one
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
